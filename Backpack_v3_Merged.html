e=\"max-width:900px;margin:0 auto;padding:48px 24px\">\n    <h6 style=\"color:var(--color-accent)\">Dashboard<\/h6>\n    <sc-if value=\"{{ noUser }}\" hint-placeholder-val=\"{{ false }}\">\n      <h1 style=\"margin-bottom:8px\">Create your account<\/h1>\n      <p class=\"text-muted\" style=\"margin-bottom:24px\">Your profile, matches and application plan are stored on this device.<\/p>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:420px\">\n        <div class=\"field\"><label>Name<\/label><input class=\"input\" type=\"text\" name=\"name\" sc-camel-on-change=\"{{ authField }}\"><\/div>\n        <div class=\"field\"><label>Email<\/label><input class=\"input\" type=\"email\" name=\"email\" sc-camel-on-change=\"{{ authField }}\"><\/div>\n        <sc-if value=\"{{ authError }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"color:var(--color-accent-700);font-size:14px;margin:0\">{{ authError }}<\/p><\/sc-if>\n        <div><button class=\"btn btn-primary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ createAccount }}\">Create account<\/button><\/div>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ hasUser }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;margin-bottom:8px\">\n        <h1 style=\"margin:0\">Hello, {{ userName }}<\/h1>\n        <button class=\"btn btn-ghost\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ signOut }}\">Sign out<\/button>\n      <\/div>\n      <p class=\"text-muted\" style=\"margin-bottom:32px\">{{ userEmail }} · member since {{ userSince }}<\/p>\n\n      <sc-if value=\"{{ hasPurchase }}\" hint-placeholder-val=\"{{ false }}\">\n        <h6 style=\"margin-bottom:12px\">Your Blueprint<\/h6>\n        <div style=\"border:2px solid var(--color-text);margin-bottom:40px;display:flex;align-items:center;gap:20px;padding:20px 24px;flex-wrap:wrap\">\n          <svg width=\"44\" height=\"56\" sc-camel-view-box=\"0 0 44 56\" style=\"flex:none\"><rect x=\"0\" y=\"0\" width=\"44\" height=\"56\" fill=\"var(--color-accent)\"><\/rect><rect x=\"8\" y=\"12\" width=\"28\" height=\"3\" fill=\"var(--color-bg)\"><\/rect><rect x=\"8\" y=\"20\" width=\"28\" height=\"2\" fill=\"var(--color-bg)\"><\/rect><rect x=\"8\" y=\"25\" width=\"20\" height=\"2\" fill=\"var(--color-bg)\"><\/rect><rect x=\"8\" y=\"30\" width=\"24\" height=\"2\" fill=\"var(--color-bg)\"><\/rect><rect x=\"8\" y=\"40\" width=\"14\" height=\"6\" fill=\"var(--color-bg)\"><\/rect><\/svg>\n          <div style=\"flex:1;min-width:220px\">\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:17px\">Relocation Blueprint — {{ purchaseDest }}<\/div>\n            <div class=\"text-muted\" style=\"font-size:13px\">Purchased {{ purchaseDate }} · sent to {{ purchaseEmail }} · updates free until next year<\/div>\n          <\/div>\n          <div style=\"display:flex;gap:12px\">\n            <button class=\"btn btn-primary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ openReport }}\">View report<\/button>\n            <button class=\"btn btn-secondary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ downloadReport }}\">Download PDF<\/button>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{ hasPlan }}\" hint-placeholder-val=\"{{ false }}\">\n        <h6 style=\"margin-bottom:12px\">Saved plan — {{ planCountry }}<\/h6>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);margin-bottom:16px\">\n          <div style=\"background:var(--color-bg);padding:16px\"><div class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.08em\">Documents<\/div><div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">{{ planDocs }}<\/div><\/div>\n          <div style=\"background:var(--color-bg);padding:16px\"><div class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.08em\">Income requirement<\/div><div style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">Appears met<div class=\"text-muted\" style=\"font-size:10px;font-weight:400\">self-reported<\/div><\/div><\/div>\n          <div style=\"background:var(--color-bg);padding:16px\"><div class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.08em\">Status<\/div><div style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">Saved plan<div class=\"text-muted\" style=\"font-size:10px;font-weight:400\">application not started<\/div><\/div><\/div>\n          <div style=\"background:var(--color-bg);padding:16px\"><div class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.08em\">Est. preparation<\/div><div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">{{ planWeeks }}<\/div><\/div>\n        <\/div>\n        <sc-if value=\"{{ noPurchase }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-sm\" style=\"padding:16px 20px;margin-bottom:40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n            <span style=\"font-size:14px\">Want the full country checklist, tax plan and week-by-week steps for this plan?<\/span>\n            <button class=\"btn btn-primary\" style=\"margin-left:auto;white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"checkout\">Get your Blueprint — $49<\/button>\n          <\/div>\n        <\/sc-if>\n      <\/sc-if>\n\n      <h6 style=\"margin-bottom:12px\">Saved profile<\/h6>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);margin-bottom:16px\">\n        <sc-for list=\"{{ profileRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <div style=\"background:var(--color-bg);padding:12px 16px\">\n            <div class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.08em\">{{ r.k }}<\/div>\n            <div style=\"font-size:14px;font-weight:600\">{{ r.v }}<\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap\">\n        <button class=\"btn btn-secondary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Edit work<\/button>\n        <button class=\"btn btn-secondary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Edit income<\/button>\n        <button class=\"btn btn-secondary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Edit family<\/button>\n        <button class=\"btn btn-secondary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Edit preferences<\/button>\n      <\/div>\n      <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 40px\">Re-running creates a new saved search — your earlier searches stay in the history below.<\/p>\n      <h6 style=\"margin-bottom:12px\">Search history<\/h6>\n      <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"text-muted\" style=\"font-size:14px\">No searches yet — run the wizard and it will be saved here.<\/p><\/sc-if>\n      <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-raw-table class=\"table\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\/sc-raw-th><sc-raw-th>Search<\/sc-raw-th><sc-raw-th>Profile<\/sc-raw-th><sc-raw-th>Top match<\/sc-raw-th><sc-raw-th>Fit<\/sc-raw-th><sc-raw-th><\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <sc-raw-tr style=\"cursor:pointer\" sc-camel-on-click=\"{{ viewHistory }}\" data-idx=\"{{ h.idx }}\">\n                <sc-raw-td style=\"white-space:nowrap\">{{ h.date }}<\/sc-raw-td>\n                <sc-raw-td style=\"font-weight:600\">{{ h.name }}<\/sc-raw-td>\n                <sc-raw-td class=\"text-muted\" style=\"font-size:12px\">{{ h.summary }}<\/sc-raw-td>\n                <sc-raw-td>{{ h.top }}<\/sc-raw-td>\n                <sc-raw-td style=\"white-space:nowrap\">{{ h.score }}/100<\/sc-raw-td>\n                <sc-raw-td>\n                  <div style=\"display:flex;gap:8px;white-space:nowrap\">\n                    <button class=\"btn btn-ghost\" style=\"font-size:12px;padding:4px 8px;white-space:nowrap\" sc-camel-on-click=\"{{ viewHistory }}\" data-idx=\"{{ h.idx }}\">View results<\/button>\n                    <button class=\"btn btn-ghost\" style=\"font-size:12px;padding:4px 8px;white-space:nowrap\" sc-camel-on-click=\"{{ deleteHistory }}\" data-idx=\"{{ h.idx }}\">Delete<\/button>\n                  <\/div>\n                <\/sc-raw-td>\n              <\/sc-raw-tr>\n            <\/sc-for>\n          <\/sc-raw-tbody>\n        <\/sc-raw-table>\n      <\/sc-if>\n    <\/sc-if>\n  <\/section>\n  <\/sc-if>\n\n  <\/main>\n\n  <footer style=\"border-top:2px solid var(--color-divider);padding:24px 48px;display:flex;gap:12px;align-items:center;font-size:12px\" class=\"text-muted\">\n    <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 26 26\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"var(--color-accent)\"><\/rect><rect x=\"7\" y=\"8\" width=\"12\" height=\"13\" fill=\"var(--color-bg)\"><\/rect><rect x=\"9\" y=\"4\" width=\"3\" height=\"4\" fill=\"var(--color-bg)\"><\/rect><rect x=\"14\" y=\"4\" width=\"3\" height=\"4\" fill=\"var(--color-bg)\"><\/rect><rect x=\"7\" y=\"12\" width=\"12\" height=\"2\" fill=\"var(--color-accent)\"><\/rect><rect x=\"11\" y=\"15\" width=\"4\" height=\"3\" fill=\"var(--color-accent)\"><\/rect><\/svg>\n    <span style=\"font-family:var(--font-heading);font-weight:800;color:var(--color-text)\">backpack<\/span>\n    <span>Information, tools and coordination for remote workers — not legal or tax advice.<\/span>\n    <span style=\"margin-left:auto\">© 2026 Backpack<\/span>\n  <\/footer>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;aiEnabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Results&quot;}, &quot;resultsCount&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 6, &quot;min&quot;: 3, &quot;max&quot;: 10, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Results&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'home', a: { regions: [], docs: [] }, matches: null, aiText: '', aiLoading: false, formError: '', user: null, auth: {}, authError: '', history: [], filter: 'All', plan: null, planSaved: false, resTab: 'matches', guide: null, pay: {}, payError: '', paid: false, reportIdx: 0, engineIncome: 3000 };\n\n  pickReport = (e) => this.setState({ reportIdx: +e.currentTarget.dataset.idx });\n  onEngine = (e) => this.setState({ engineIncome: +e.target.value });\n\n  payField = (e) => this.setState({ pay: { ...this.state.pay, [e.target.name]: e.target.value } });\n  openReport = () => {\n    let { matches, a } = this.state;\n    if (!matches && a && a.income) matches = this.evaluate(a);\n    this.setState({ matches, screen: 'report', reportIdx: 0 });\n    window.scrollTo(0, 0);\n  };\n  downloadReport = () => { this.openReport(); setTimeout(() => window.print(), 400); };\n  pay = () => {\n    const p = this.state.pay;\n    if (!p.ccName || !p.ccEmail || !p.ccEmail.includes('@') || !p.ccNum || p.ccNum.replace(/\\D/g, '').length < 15 || !p.ccExp || !p.ccCvc) {\n      this.setState({ payError: 'Please complete all card fields (any test values work in this demo).' }); return;\n    }\n    const purchase = { date: new Date().toISOString().slice(0, 10), email: p.ccEmail, dest: ((this.state.matches || [])[0] || {}).c || 'your destinations' };\n    try { localStorage.setItem('bpv2_purchase', JSON.stringify(purchase)); } catch (e) {}\n    this.setState({ paid: true, payError: '', purchase });\n    window.scrollTo(0, 0);\n  };\n\n  openGuide = (e) => { this.setState({ screen: 'guide', guide: e.currentTarget.dataset.guide }); window.scrollTo(0, 0); };\n\n  guides() {\n    return {\n      spain: { kicker: 'Country guide · Nomad visa up to 5 yrs', title: 'Spain: the year-round base', img: 'photo: barcelona rooftops at dusk, b&w', img2: 'photo: café terrace, seville, b&w',\n        teaser: 'Autumn at 24°C, lunch that lasts two hours, and the EU\\'s friendliest local-client rule.',\n        paras: [\n          'Most of Europe packs up in October. Spain doesn\\'t. Seville and Valencia hold 20–26°C deep into November, and even January in Andalusia means coffee outside in the sun. For anyone timing a Schengen year around weather, Spain is the winter anchor — the place you route the cold months through while the rest of the continent turns gray.',\n          'The daily texture is what keeps people past their visa: menú del día lunches for €14, dinner at ten, a train network that puts Madrid–Valencia at under two hours, and neighborhoods — Malasaña, Gràcia, Triana — where the coworking space, the market and the tapas bar share one block. Fiber internet is near-universal and among the fastest in Europe.',\n          'And the history is not a museum-ticket thing here; it\\'s the commute. The Alhambra, the Mezquita, Gaudí\\'s whole skyline, Roman aqueducts on the walk to lunch. Weekend trips write themselves for a year straight without repeating.',\n        ],\n        highlights: [\n          'Winter sun: Andalusia and the Levante coast stay mild when the rest of Europe freezes',\n          'The 20% rule: Spain\\'s nomad visa lets freelancers keep up to a fifth of income from Spanish clients — unique in the EU',\n          'Beckham regime: many newcomers pay a flat 24% for years',\n          'AVE high-speed rail: Madrid to Barcelona, Valencia or Seville in ~2.5 hours',\n          'Real residency ladder: renewals to 5 years, then long-term EU residence',\n        ],\n        facts: [\n          { k: 'Income required', v: '≈€2,760/mo (200% min wage)' }, { k: 'Best months', v: 'Sep–Nov, Mar–May (south: all winter)' },\n          { k: 'Cost (single, incl. rent)', v: '≈€2,300/mo' }, { k: 'Internet', v: 'Fiber ~600 Mbps, everywhere' },\n          { k: 'Community', v: 'Barcelona, Madrid, Valencia, Málaga' }, { k: 'Watch out', v: 'Tax residency at day 183' },\n        ]},\n      portugal: { kicker: 'Country guide · D8 visa, PR at 5 yrs', title: 'Portugal: the soft landing', img: 'photo: lisbon tram 28 climbing alfama, b&w', img2: 'photo: surfer at ericeira, b&w',\n        teaser: 'Atlantic light, pastel de nata economics, and the strongest citizenship path in Europe.',\n        paras: [\n          'Portugal is where the digital nomad wave landed first, and the infrastructure shows it: Lisbon and Porto are dense with coworking spaces, English is effectively a second language in both cities, and there\\'s a meetup for everything from surf mornings to founder dinners. You will not spend a single week building a social life from zero.',\n          'The country runs on a gentler dial than its neighbors. Ocean at the end of the street, seafood lunches that cost less than a sandwich in London, 300 days of Atlantic light a year. Ericeira and the Algarve pull the surf crowd; Madeira runs a purpose-built nomad village with its own calendar of events.',\n          'The strategic reason to choose Portugal is the ladder: D8 residence renews to five years, and five years is what citizenship requires. No other nomad-friendly program in Europe converts a laptop job into an EU passport this directly.',\n        ],\n        highlights: [\n          'PR and citizenship at 5 years — the clearest path in Europe',\n          'Madeira\\'s Digital Nomad Village: a ready-made community with fiber and ocean views',\n          'Surf culture: Ericeira is a World Surfing Reserve 40 minutes from Lisbon',\n          'NHR 2.0 tax regime for qualifying professions',\n          'Porto and Lisbon rank among Europe\\'s top food cities — at half the price',\n        ],\n        facts: [\n          { k: 'Income required', v: '€3,680/mo (4× min wage)' }, { k: 'Best months', v: 'May–Oct (mild all year)' },\n          { k: 'Cost (single, incl. rent)', v: '≈€2,100/mo' }, { k: 'Internet', v: 'Fiber ~500 Mbps in cities' },\n          { k: 'Community', v: 'Lisbon, Porto, Madeira, Ericeira' }, { k: 'Watch out', v: 'Lisbon rents rose fast; queues at AIMA' },\n        ]},\n      georgia: { kicker: 'Country guide · 365 days visa-free', title: 'Georgia: the no-paperwork year', img: 'photo: tbilisi old town balconies, b&w', img2: 'photo: caucasus mountains above kazbegi, b&w',\n        teaser: 'Land at the airport, get a year. Wine country, mountain weekends, and a 1% tax scheme.',\n        paras: [\n          'For about 95 nationalities Georgia asks for nothing: no application, no income proof, no appointment. You land in Tbilisi and the stamp is good for 365 days. It is the lowest-friction long stay on the planet, which makes it the default answer whenever visa bureaucracy elsewhere gets exhausting.',\n          'Tbilisi itself is the surprise. Art-nouveau balconies over sulfur baths, a café scene that runs on specialty coffee and cheap khachapuri, and a nomad community that has made Vera and Vake its home districts. Living costs sit around half of Western Europe; a comfortable month runs near $1,200.',\n          'Then there\\'s the weekend radius: Kazbegi\\'s 5,000-meter peaks three hours north, the Kakheti wine region — 8,000 years of winemaking, the oldest on earth — two hours east, and Black Sea beaches at Batumi for the summer. Register as an individual entrepreneur and qualifying income is taxed at 1%.',\n        ],\n        highlights: [\n          'A full year, zero paperwork, for ~95 passports',\n          '1% small-business tax scheme on income up to ~$155k/yr',\n          'Kakheti: the world\\'s oldest wine region, two hours from the capital',\n          'Cost of living around half of Western Europe',\n          'Caucasus trekking and ski season (Gudauri) in the same year as beach months',\n        ],\n        facts: [\n          { k: 'Income required', v: 'None' }, { k: 'Best months', v: 'May–Jun, Sep–Oct (ski: Dec–Mar)' },\n          { k: 'Cost (single, incl. rent)', v: '≈$1,200/mo' }, { k: 'Internet', v: 'Fast & cheap in Tbilisi/Batumi' },\n          { k: 'Community', v: 'Tbilisi (Vera, Vake), Batumi' }, { k: 'Watch out', v: 'Tax residency at 183 days; power cuts in old buildings' },\n        ]},\n      thailand: { kicker: 'Country guide · DTV, 5 yrs multi-entry', title: 'Thailand: five years of warm seasons', img: 'photo: longtail boats, railay bay, b&w', img2: 'photo: chiang mai street market, b&w',\n        teaser: 'One savings proof buys five years of 180-day stays — islands, mountains and the best street food economy on earth.',\n        paras: [\n          'The DTV changed the math on Thailand: show roughly $14,500 in savings once, and you hold a five-year multi-entry visa with 180 days per stay. No monthly income bar, no annual re-application. For anyone who wants Asia as a recurring season rather than a one-off trip, nothing else comes close.',\n          'The country splits neatly into moods. Bangkok for full-speed city life and the best food-per-dollar ratio anywhere; Chiang Mai for cool-season mornings, old-city temples and the original nomad café scene; the islands — Koh Lanta, Koh Phangan — for months where the commute is a beach walk.',\n          'Costs stay gentle: a serviced apartment, daily street food and a scooter come in near $1,400 a month. November through February is the season everyone plans around — dry, 28°C, and the reason \"wintering in Thailand\" is a verb.',\n        ],\n        highlights: [\n          'Five years of access for a one-time savings proof — no income minimum',\n          'Nov–Feb dry season: 28°C while Europe and the US freeze',\n          'Chiang Mai and Bangkok: two of the world\\'s original nomad hubs',\n          'Street food culture recognized by UNESCO — eat well for $5/day',\n          'Island months: Lanta, Phangan, Samui within a cheap flight',\n        ],\n        facts: [\n          { k: 'Requirement', v: 'THB 500k (≈$14.5k) savings' }, { k: 'Best months', v: 'Nov–Feb (dry, cool)' },\n          { k: 'Cost (single, incl. rent)', v: '≈$1,400/mo' }, { k: 'Internet', v: 'Excellent fiber + cheap 5G' },\n          { k: 'Community', v: 'Chiang Mai, Bangkok, Koh Lanta' }, { k: 'Watch out', v: 'Remitted income may be taxed — get advice' },\n        ]},\n      mexico: { kicker: 'Country guide · 180 days on entry', title: 'Mexico: half a year, no forms', img: 'photo: cdmx roma norte street, b&w', img2: 'photo: oaxaca market colors, b&w',\n        teaser: 'Six months at a stamp, US time zones, and a food culture that rearranges your standards.',\n        paras: [\n          'Mexico\\'s pitch to remote workers is brutally simple: most strong passports get up to 180 days stamped at the border, the time zone lines up with US clients and standups, and the flight home is short. It\\'s why Mexico City quietly became the largest nomad hub in the Americas.',\n          'CDMX rewards the stay. Roma Norte and Condesa are walkable, tree-lined and dense with cafés built for laptops; the food scene runs from $1 tacos al pastor to a top-ten world restaurant list; and altitude keeps the climate at a permanent 22°C spring. When the city gets loud, Oaxaca, San Miguel and the Pacific coast are a cheap flight away.',\n          'The practical math works too: $1,500–2,000 a month lives well outside the tourist core, and as a non-resident on foreign income there\\'s typically nothing to file locally for a sub-183-day stay.',\n        ],\n        highlights: [\n          'US time zones — no 6 a.m. standups',\n          'CDMX: eternal-spring climate at 2,200m, café culture built for remote work',\n          'Oaxaca food scene: mole, mezcal, markets — a reason to relocate by itself',\n          'Day of the Dead, whale season, Pacific surf — a packed calendar',\n          '180 days is long enough to live, not just visit',\n        ],\n        facts: [\n          { k: 'Income required', v: 'None (length discretionary at entry)' }, { k: 'Best months', v: 'Oct–Apr (dry season)' },\n          { k: 'Cost (single, incl. rent)', v: '≈$1,500/mo' }, { k: 'Internet', v: 'Good fiber in CDMX/GDL; patchy on coasts' },\n          { k: 'Community', v: 'CDMX (Roma/Condesa), Oaxaca, PDC' }, { k: 'Watch out', v: 'Officers may grant fewer than 180 days' },\n        ]},\n      colombia: { kicker: 'Country guide · Nomad visa up to 2 yrs', title: 'Colombia: eternal spring on $1,000', img: 'photo: medellín valley from comuna 13, b&w', img2: 'photo: cartagena old city wall, b&w',\n        teaser: 'The lowest income bar of any nomad visa, in the city that invented the comeback.',\n        paras: [\n          'Colombia\\'s Visa V asks for roughly three times the local minimum wage — about US$1,000 a month, the lowest real threshold of any digital nomad visa. For early-career remote workers it\\'s often the only dedicated visa their income already clears.',\n          'Medellín is the anchor: the \"city of eternal spring\" holds 22–28°C every single week of the year, so there is no bad month to arrive. El Poblado and Laureles run on specialty coffee and coworking; the metrocable turns the valley into a commute with a view; and salsa nights are a standing social calendar that absorbs newcomers fast.',\n          'Weekenders get the second act: Cartagena\\'s walled city on the Caribbean, Guatapé\\'s lake country two hours out, the Coffee Axis — Salento, Filandia — where the farm tour ends in the best cup you\\'ve had. Bogotá adds big-city museums and food at altitude.',\n        ],\n        highlig
