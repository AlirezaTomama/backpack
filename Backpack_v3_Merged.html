  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        if (isPageRoot || window.parent === window) return; // authoritative miss

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ost of living, tax complexity and residency paths.\",\"inLanguage\":\"en\"},\n{\"@type\":\"WebApplication\",\"name\":\"Backpack Visa Finder\",\"applicationCategory\":\"TravelApplication\",\"offers\":[{\"@type\":\"Offer\",\"name\":\"Self-Serve report\",\"price\":\"49\",\"priceCurrency\":\"USD\"},{\"@type\":\"Offer\",\"name\":\"Guided\",\"price\":\"199\",\"priceCurrency\":\"USD\"},{\"@type\":\"Offer\",\"name\":\"Expert Assisted\",\"price\":\"800\",\"priceCurrency\":\"USD\"}],\"featureList\":\"Eligibility matching across 19 destinations, document readiness check, week-by-week application plan, comparison of cost, tax and permanent-residency potential\"},\n{\"@type\":\"FAQPage\",\"mainEntity\":[\n{\"@type\":\"Question\",\"name\":\"What is a digital nomad visa?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"A residence permit that lets you live in a country while working remotely for employers or clients based outside it. Unlike a tourist visa it explicitly authorizes remote work, typically for 6 to 24 months, sometimes up to 5 years.\"}},\n{\"@type\":\"Question\",\"name\":\"How much income do I need for a digital nomad visa in 2026?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Thresholds range from about $750 per month (Colombia) to $5,400+ (Japan). Mid-range examples: Spain 200% of minimum wage (about €2,760), Estonia €3,960, Portugal €3,680, Greece and Cyprus about €3,500, Malta €42,000 gross per year, Costa Rica $3,000 ($5,000 with family). Georgia and Mauritius have light or no income minimums. Family members raise the requirement in most programs.\"}},\n{\"@type\":\"Question\",\"name\":\"Does it matter whether I am a remote employee, freelancer or founder?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. Some programs require an employment contract and a remote-work authorization letter; others accept client contracts and invoices; a few (like Germany's Freiberufler) require self-employment. Croatia bars work for local clients, while Spain allows freelancers up to 20% local income. Backpack checks eligibility separately for each work type.\"}},\n{\"@type\":\"Question\",\"name\":\"Being eligible and being ready to apply — what's the difference?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Eligibility means you meet the income and work-type rules. Readiness means your documents exist: bank statements, remote-work letter, criminal record check, health insurance, apostilles and translations. Backpack scores both and generates a week-by-week preparation plan.\"}}\n]}]}\n<\/script>\n<style>\n  a { color: var(--color-accent); }\n  a:hover { color: var(--color-accent-600); }\n  @keyframes bp-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n  @keyframes bp-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }\n<\/style>\n<\/helmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n  <nav class=\"nav\">\n    <div class=\"nav-brand\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"home\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 26 26\" aria-label=\"Backpack logo\"><rect x=\"0\" y=\"0\" width=\"26\" height=\"26\" fill=\"var(--color-accent)\"><\/rect><rect x=\"7\" y=\"8\" width=\"12\" height=\"13\" fill=\"var(--color-bg)\"><\/rect><rect x=\"9\" y=\"4\" width=\"3\" height=\"4\" fill=\"var(--color-bg)\"><\/rect><rect x=\"14\" y=\"4\" width=\"3\" height=\"4\" fill=\"var(--color-bg)\"><\/rect><rect x=\"7\" y=\"12\" width=\"12\" height=\"2\" fill=\"var(--color-accent)\"><\/rect><rect x=\"11\" y=\"15\" width=\"4\" height=\"3\" fill=\"var(--color-accent)\"><\/rect><\/svg>\n      backpack\n    <\/div>\n    <a sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"home\" aria-current=\"{{ curHome }}\" style=\"cursor:pointer\">Home<\/a>\n    <a sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\" aria-current=\"{{ curFinder }}\" style= eading);font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap\">\n            <span>No visa agents<\/span><span>●<\/span><span>No $3,000 consultants<\/span><span>●<\/span><span>Real thresholds, real sources<\/span><span>●<\/span><span>Re-checked monthly<\/span><span>●<\/span><span>No visa agents<\/span><span>●<\/span><span>No $3,000 consultants<\/span><span>●<\/span><span>Real thresholds, real sources<\/span><span>●<\/span><span>Re-checked monthly<\/span><span>●<\/span>\n          <\/div>\n          <div style=\"display:flex;gap:40px;padding-right:40px;font-family:var(--font-heading);font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap\" aria-hidden=\"true\">\n            <span>No visa agents<\/span><span>●<\/span><span>No $3,000 consultants<\/span><span>●<\/span><span>Real thresholds, real sources<\/span><span>●<\/span><span>Re-checked monthly<\/span><span>●<\/span><span>No visa agents<\/span><span>●<\/span><span>No $3,000 consultants<\/span><span>●<\/span><span>Real thresholds, real sources<\/span><span>●<\/span><span>Re-checked monthly<\/span><span>●<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"padding:64px 48px;border-bottom:3px solid var(--color-text)\">\n      <h2 style=\"font-size:clamp(30px,3.2vw,44px);margin:0;max-width:24ch\">Drag your income. Watch the world open.<\/h2>\n      <p class=\"text-muted\" style=\"font-size:15px;margin:10px 0 0;max-width:62ch\">This is the actual engine — live, right here. Slide to your monthly income and see which 2026 programs your number already clears. No email, no signup.<\/p>\n      <div class=\"bp2-dial\">\n        <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap\">\n          <span style=\"font-family:var(--font-heading);font-weight:800;font-size:12px;letter-spacing:0.12em;text-transform:uppercase\" class=\"text-muted\">Your monthly income<\/span>\n          <span class=\"bp2-amount\">{{ engineAmount }}<small>/mo<\/small><\/span>\n          <span style=\"margin-left:auto;font-family:var(--font-heading);font-weight:800;font-size:15px\"><b style=\"color:var(--color-accent);font-size:22px\">{{ engineCount }}<\/b> of {{ engineTotal }} destinations unlocked<\/span>\n        <\/div>\n        <input type=\"range\" min=\"0\" max=\"6000\" step=\"100\" class=\"bp2-range\" sc-camel-default-value=\"{{ engineStart }}\" sc-camel-on-change=\"{{ onEngine }}\" aria-label=\"Monthly income in US dollars\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:22px\">\n          <sc-for list=\"{{ engineChips }}\" as=\"ch\" hint-placeholder-count=\"16\">\n            <span class=\"{{ ch.cls }}\">{{ ch.label }} <span class=\"bp2-thr\">{{ ch.thr }}<\/span><\/span>\n          <\/sc-for>\n        <\/div>\n        <p class=\"text-muted\" style=\"font-size:12px;margin:16px 0 0\">Solo applicant, income route only. Savings routes (Thailand DTV), family surcharges and document rules are checked in the full wizard.<\/p>\n        <div style=\"margin-top:20px\"><button class=\"bp2-btn\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Run the full check — free<\/button><\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"padding:48px;border-bottom:3px solid var(--color-text)\">\n      <h2 style=\"font-size:15px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 24px\">Built for how you actually earn<\/h2>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <h3 style=\"margin:0 0 8px;font-size:18px\">Remote employee<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">Employed by a foreign company with written remote-work authorization. We check which programs accept employment contracts and which need the letter.<\/p>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <h3 style=\"margin:0 0 8px;font-size:18px\">Freelancer / contractor<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">Multiple foreign clients, contracts and bank flow. We flag where local clients are allowed (Spain: up to 20%) and where they're banned (Croatia).<\/p>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <h3 style=\"margin:0 0 8px;font-size:18px\">Founder / business owner<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">You own the company you run remotely. We check programs that accept ownership proof and dividends as income — and where your company's registration matters.<\/p>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <h3 style=\"margin:0 0 8px;font-size:18px\">Remote family<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">One income, several passports. We apply each program's family surcharge (Portugal +50%/+30%, Costa Rica $5,000 flat) and flag spouse work rights and schooling.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"padding:64px 48px;border-bottom:3px solid var(--color-text)\">\n      <h2 style=\"font-size:clamp(30px,3.2vw,44px);margin:0\">Pick your season, not just your visa.<\/h2>\n      <p class=\"text-muted\" style=\"font-size:15px;margin:10px 0 0;max-width:62ch\">Six passport stamps we'd chase first. Every card opens a full country guide with real thresholds and honest \"watch out\" notes.<\/p>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px;margin-top:36px\">\n        <article class=\"bp2-stamp\" sc-camel-on-click=\"{{ openGuide }}\" data-guide=\"spain\"><span class=\"bp2-go\">↗<\/span><span style=\"font-size:30px;line-height:1\">🇪🇸<\/span><h3 style=\"font-size:20px;margin:10px 0 0\">Spain<\/h3><div class=\"bp2-fact\">≈€2,760/mo · up to 5 yrs<\/div><p style=\"font-size:13px;margin:8px 0 0\" class=\"text-muted\">Winter sun in Andalusia, the EU's friendliest local-client rule, and a real residency ladder.<\/p><\/article>\n        <article class=\"bp2-stamp\" sc-camel-on-click=\"{{ openGuide }}\" data-guide=\"portugal\"><span class=\"bp2-go\">↗<\/span><span style=\"font-size:30px;line-height:1\">🇵🇹<\/span><h3 style=\"font-size:20px;margin:10px 0 0\">Portugal<\/h3><div class=\"bp2-fact\">€3,680/mo · PR at 5 yrs<\/div><p style=\"font-size:13px;margin:8px 0 0\" class=\"text-muted\">Atlantic light, surf at Ericeira, and the clearest laptop-to-EU-passport path in Europe.<\/p><\/article>\n        <article class=\"bp2-stamp\" sc-camel-on-click=\"{{ openGuide }}\" data-guide=\"georgia\"><span class=\"bp2-go\">↗<\/span><span style=\"font-size:30px;line-height:1\">🇬🇪<\/span><h3 style=\"font-size:20px;margin:10px 0 0\">Georgia<\/h3><div class=\"bp2-fact\">No minimum · 365 days<\/div><p style=\"font-size:13px;margin:8px 0 0\" class=\"text-muted\">Land in Tbilisi, get a year at the stamp. Wine country weekends and a 1% small-business tax.<\/p><\/article>\n        <article class=\"bp2-stamp\" sc-camel-on-click=\"{{ openGuide }}\" data-guide=\"thailand\"><span class=\"bp2-go\">↗<\/span><span style=\"font-size:30px;line-height:1\">🇹🇭<\/span><h3 style=\"font-size:20px;margin:10px 0 0\">Thailand<\/h3><div class=\"bp2-fact\">≈$14.5k savings · 5 yrs<\/div><p style=\"font-size:13px;margin:8px 0 0\" class=\"text-muted\">One savings proof buys five years of 180-day stays. Nov–Feb is 28°C while Europe freezes.<\/p><\/article>\n        <article class=\"bp2-stamp\" sc-camel-on-click=\"{{ openGuide }}\" data-guide=\"mexico\"><span class=\"bp2-go\">↗<\/span><span style=\"font-size:30px;line-height:1\">🇲🇽<\/span><h3 style=\"font-size:20px;margin:10px 0 0\">Mexico<\/h3><div class=\"bp2-fact\">No minimum · 180 days<\/div><p style=\"font-size:13px;margin:8px 0 0\" class=\"text-muted\">US time zones, CDMX's eternal spring, and $1 tacos al pastor. Half a year, zero forms.<\/p><\/article>\n        <article class=\"bp2-stamp\" sc-camel-on-click=\"{{ openGuide }}\" data-guide=\"colombia\"><span class=\"bp2-go\">↗<\/span><span style=\"font-size:30px;line-height:1\">🇨🇴<\/span><h3 style=\"font-size:20px;margin:10px 0 0\">Colombia<\/h3><div class=\"bp2-fact\">≈$1,000/mo · up to 2 yrs<\/div><p style=\"font-size:13px;margin:8px 0 0\" class=\"text-muted\">The lowest income bar of any nomad visa, in the city of eternal spring: Medellín.<\/p><\/article>\n      <\/div>\n      <div style=\"margin-top:26px\"><button class=\"bp2-btn-ghost\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"visas\">See all 19 destinations →<\/button><\/div>\n    <\/div>\n\n    <div style=\"padding:48px;border-bottom:3px solid var(--color-text)\">\n      <h2 style=\"font-size:15px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 24px\">Income thresholds at a glance (2026)<\/h2>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--color-divider);border:2px solid var(--color-divider)\">\n        <sc-for list=\"{{ homeCards }}\" as=\"hc\" hint-placeholder-count=\"7\">\n          <div style=\"background:var(--color-bg);padding:20px;display:flex;flex-direction:column;gap:6px;cursor:pointer\" style-hover=\"background:var(--color-surface)\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"visas\">\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:17px\">{{ hc.country }}<\/div>\n            <div style=\"font-size:13px;color:var(--color-accent-700);font-weight:600\">{{ hc.income }}<\/div>\n            <div class=\"text-muted\" style=\"font-size:12px\">{{ hc.note }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"background:var(--color-accent);color:var(--color-bg);padding:20px;display:flex;align-items:flex-end;font-family:var(--font-heading);font-weight:800;font-size:14px;cursor:pointer\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Which one fits you? →<\/div>\n      <\/div>\n      <p class=\"text-muted\" style=\"font-size:12px;margin:12px 0 0\">Every threshold carries its official source and an effective date — re-checked monthly, last check August 2026.<\/p>\n    <\/div>\n\n    <div style=\"padding:48px;border-bottom:3px solid var(--color-text)\">\n      <h2 style=\"font-size:15px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 24px\">Eligible is not the same as ready<\/h2>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <div class=\"bp2-stepn\" style=\"background:var(--color-accent);color:var(--color-bg);transform:rotate(-6deg)\">1<\/div>\n          <h4>Eligibility match<\/h4>\n          <p class=\"text-muted\" style=\"font-size:14px\">Your income, work type, passport and family run against every program's rules — ranked with a match score and a side-by-side comparison of your top three.<\/p>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <div class=\"bp2-stepn\" style=\"background:#ffd23f;color:var(--color-text);transform:rotate(4deg)\">2<\/div>\n          <h4>Document readiness<\/h4>\n          <p class=\"text-muted\" style=\"font-size:14px\">Bank statements, remote-work letter, criminal record, insurance, apostilles, translations — what's ready, what's missing, and what that does to your timeline.<\/p>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-text);padding-top:16px\">\n          <div class=\"bp2-stepn\" style=\"background:#2f6bff;color:var(--color-bg);transform:rotate(-3deg)\">3<\/div>\n          <h4>Action plan<\/h4>\n          <p class=\"text-muted\" style=\"font-size:14px\">A week-by-week preparation plan — from employer letter to consulate appointment — tracked in your dashboard until the visa is in your passport.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"padding:48px;border-bottom:3px solid var(--color-text)\">\n      <h2 style=\"font-size:15px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 24px\">Frequently asked questions<\/h2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:1100px\">\n        <div>\n          <h3 style=\"font-size:17px;margin:0 0 8px\">What is a digital nomad visa?<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">A residence permit that lets you live in a country while working remotely for employers or clients outside it — typically 6–24 months, sometimes up to 5 years.<\/p>\n        <\/div>\n        <div>\n          <h3 style=\"font-size:17px;margin:0 0 8px\">How much income do I need in 2026?<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">From ~$750/mo (Colombia) to $5,400+ (Japan). Spain asks 200% of its minimum wage, Estonia €3,960, Malta €42,000/yr gross, Costa Rica $3,000 ($5,000 with family). Georgia and Mauritius are lightest.<\/p>\n        <\/div>\n        <div>\n          <h3 style=\"font-size:17px;margin:0 0 8px\">Does my work type matter?<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">Yes — some programs need an employment contract and remote-work letter, others accept invoices and client contracts, and freelance permits require self-employment. Local-client rules differ per country.<\/p>\n        <\/div>\n        <div>\n          <h3 style=\"font-size:17px;margin:0 0 8px\">Eligible vs ready to apply?<\/h3>\n          <p class=\"text-muted\" style=\"font-size:14px;margin:0\">Eligibility is the rules; readiness is the paperwork. Backpack scores both — including apostilles and translations — and turns the gap into a weekly plan.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"background:var(--color-accent);color:var(--color-bg);padding:80px 48px;display:flex;flex-direction:column;gap:20px;position:relative;overflow:hidden\">\n      <h2 style=\"font-size:clamp(38px,4.6vw,64px);margin:0;max-width:20ch;position:relative;z-index:1\">Stop googling visa forums. Run your numbers.<\/h2>\n      <div style=\"position:relative;z-index:1\"><button class=\"bp2-btn\" style=\"background:var(--color-bg);color:var(--color-text)\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"finder\">Run the eligibility wizard<\/button><\/div>\n      <div class=\"bp2-bigword\">ANYWHERE<\/div>\n    <\/div>\n  <\/section>\n  <\/sc-if>\n\n\n  <sc-if value=\"{{ isFinder }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Eligibility wizard\" style=\"max-width:800px;margin:0 auto;padding:48px 24px\">\n    <h6 style=\"color:var(--color-accent)\">Eligibility wizard<\/h6>\n    <h1 style=\"margin-bottom:8px\">Tell us how you work and travel<\/h1>\n    <p class=\"text-muted\" style=\"margin-bottom:32px\">Four short sections, 3–5 minutes. Saved to your dashboard on this device.<\/p>\n    <div style=\"display:flex;flex-direction:column;gap:40px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0;border-bottom:2px solid var(--color-text);padding-bottom:8px\">1 · About you<\/h2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Country of citizenship<\/label><input class=\"input\" type=\"text\" name=\"citizenship\" placeholder=\"e.g. Iran\" sc-camel-default-value=\"{{ savedCitizenship }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n          <div class=\"field\"><label>Second citizenship (if any)<\/label><input class=\"input\" type=\"text\" name=\"citizenship2\" placeholder=\"optional\" sc-camel-default-value=\"{{ savedCitizenship2 }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Country you legally live in now<\/label><input class=\"input\" type=\"text\" name=\"residence\" placeholder=\"you'll usually apply from here\" sc-camel-default-value=\"{{ savedResidence }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n          <div class=\"field\"><label>Your immigration status there<\/label>\n            <sc-raw-select class=\"input\" name=\"status\" sc-camel-default-value=\"{{ savedStatus }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>Citizen<\/option><option>Permanent resident<\/option><option>Temporary visa<\/option><option>Other / complicated<\/option>\n            <\/sc-raw-select>\n          <\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Visa-free reach of your strongest passport<\/label>\n            <sc-raw-select class=\"input\" name=\"passport\" sc-camel-default-value=\"{{ savedPassport }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>EU / US / UK / CA / AU / JP<\/option><option>Other visa-waiver passport<\/option><option>Needs visas almost everywhere<\/option>\n            <\/sc-raw-select>\n          <\/div>\n          <div class=\"field\"><label>Age<\/label><input class=\"input\" type=\"number\" name=\"age\" min=\"18\" max=\"80\" placeholder=\"e.g. 31\" sc-camel-default-value=\"{{ savedAge }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Who's coming with you?<\/label>\n            <sc-raw-select class=\"input\" name=\"family\" sc-camel-default-value=\"{{ savedFamily }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>Solo<\/option><option>Partner<\/option><option>Partner + kids<\/option>\n            <\/sc-raw-select>\n          <\/div>\n          <div class=\"field\"><label>When do you want to move?<\/label>\n            <sc-raw-select class=\"input\" name=\"moveDate\" sc-camel-default-value=\"{{ savedMoveDate }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>Within 3 months<\/option><option>3–6 months<\/option><option>6+ months / exploring<\/option>\n            <\/sc-raw-select>\n          <\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n          <div class=\"field\"><label>Ever had a visa refusal?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"refusal\" value=\"No\" checked=\"{{ refNo }}\" sc-camel-on-change=\"{{ onField }}\">No<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"refusal\" value=\"Yes\" checked=\"{{ refYes }}\" sc-camel-on-change=\"{{ onField }}\">Yes<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\"><label>Criminal convictions or pending charges?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"criminal\" value=\"No\" checked=\"{{ crimNo }}\" sc-camel-on-change=\"{{ onField }}\">No<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"criminal\" value=\"Yes\" checked=\"{{ crimYes }}\" sc-camel-on-change=\"{{ onField }}\">Yes<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\"><label>Ever overstayed or been removed?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"overstay\" value=\"No\" checked=\"{{ ovNo }}\" sc-camel-on-change=\"{{ onField }}\">No<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"overstay\" value=\"Yes\" checked=\"{{ ovYes }}\" sc-camel-on-change=\"{{ onField }}\">Yes<\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0;border-bottom:2px solid var(--color-text);padding-bottom:8px\">2 · Your work<\/h2>\n        <div class=\"field\"><label>How do you earn?<\/label>\n          <div class=\"seg\">\n            <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"workType\" value=\"Remote employee\" checked=\"{{ wtEmp }}\" sc-camel-on-change=\"{{ onField }}\">Remote employee<\/label>\n            <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"workType\" value=\"Freelancer / contractor\" checked=\"{{ wtFree }}\" sc-camel-on-change=\"{{ onField }}\">Freelancer / contractor<\/label>\n            <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"workType\" value=\"Founder / business owner\" checked=\"{{ wtFound }}\" sc-camel-on-change=\"{{ onField }}\">Founder / business owner<\/label>\n          <\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>{{ employerLabel }}<\/label><input class=\"input\" type=\"text\" name=\"employerCountry\" placeholder=\"exact country — e.g. Germany\" sc-camel-default-value=\"{{ savedEmployerCountry }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n          <div class=\"field\"><label>How long with this employer / in this business?<\/label>\n            <sc-raw-select class=\"input\" name=\"tenure\" sc-camel-default-value=\"{{ savedTenure }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>Under 6 months<\/option><option>6–12 months<\/option><option>1–3 years<\/option><option>3+ years<\/option>\n            <\/sc-raw-select>\n          <\/div>\n        <\/div>\n        <sc-if value=\"{{ wtEmp }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"field\"><label>Can your employer issue a written remote-work authorization?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"remoteLetter\" value=\"Yes\" checked=\"{{ rlYes }}\" sc-camel-on-change=\"{{ onField }}\">Yes<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"remoteLetter\" value=\"Not sure\" checked=\"{{ rlUnsure }}\" sc-camel-on-change=\"{{ onField }}\">Not sure yet<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"remoteLetter\" value=\"No\" checked=\"{{ rlNo }}\" sc-camel-on-change=\"{{ onField }}\">No<\/label>\n            <\/div>\n          <\/div>\n        <\/sc-if>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>{{ localClientsLabel }}<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"localClients\" value=\"No\" checked=\"{{ lcNo }}\" sc-camel-on-change=\"{{ onField }}\">No<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"localClients\" value=\"Maybe\" checked=\"{{ lcMaybe }}\" sc-camel-on-change=\"{{ onField }}\">Maybe<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\"><label>University degree or 3+ yrs professional track record?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"degree\" value=\"Yes\" checked=\"{{ degYes }}\" sc-camel-on-change=\"{{ onField }}\">Yes<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"degree\" value=\"No\" checked=\"{{ degNo }}\" sc-camel-on-change=\"{{ onField }}\">No<\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0;border-bottom:2px solid var(--color-text);padding-bottom:8px\">3 · Your income &amp; documents<\/h2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Average monthly income, last 6 months (USD)<\/label><input class=\"input\" type=\"number\" name=\"income\" min=\"0\" placeholder=\"e.g. 4200\" sc-camel-default-value=\"{{ savedIncome }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n          <div class=\"field\"><label>Savings you can show<\/label>\n            <sc-raw-select class=\"input\" name=\"savings\" sc-camel-default-value=\"{{ savedSavings }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>Under $5k<\/option><option>$5k–$15k<\/option><option>$15k–$50k<\/option><option>Over $50k<\/option>\n            <\/sc-raw-select>\n          <\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Is that figure gross or net?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"grossNet\" value=\"Gross\" checked=\"{{ gnGross }}\" sc-camel-on-change=\"{{ onField }}\">Gross<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"grossNet\" value=\"Net\" checked=\"{{ gnNet }}\" sc-camel-on-change=\"{{ onField }}\">Net<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"field\"><label>Income stability<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"stability\" value=\"Stable\" checked=\"{{ stStable }}\" sc-camel-on-change=\"{{ onField }}\">Stable every month<\/label>\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"stability\" value=\"Variable\" checked=\"{{ stVar }}\" sc-camel-on-change=\"{{ onField }}\">Varies a lot<\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Lowest single month in that period (USD)<\/label><input class=\"input\" type=\"number\" name=\"lowIncome\" min=\"0\" placeholder=\"e.g. 2800\" sc-camel-default-value=\"{{ savedLowIncome }}\" sc-camel-on-change=\"{{ onField }}\"><\/div>\n          <div class=\"field\"><label>Months of bank statements you can produce<\/label>\n            <sc-raw-select class=\"input\" name=\"stmtMonths\" sc-camel-default-value=\"{{ savedStmtMonths }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>1–2<\/option><option>3<\/option><option>6<\/option><option>12+<\/option>\n            <\/sc-raw-select>\n          <\/div>\n        <\/div>\n        <div class=\"field\"><label>Documents you could produce this week<\/label>\n          <div class=\"seg\" style=\"flex-wrap:wrap\">\n            <sc-for list=\"{{ docOpts }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"checkbox\" name=\"docs\" value=\"{{ d.id }}\" checked=\"{{ d.on }}\" sc-camel-on-change=\"{{ onField }}\">{{ d.label }}<\/label>\n            <\/sc-for>\n          <\/div>\n          <p class=\"text-muted\" style=\"font-size:11px;margin:6px 0 0\">{{ docsCount }} selected · red = selected. Availability is self-reported — destination-specific compliance is checked after matching.<\/p>\n        <\/div>\n      <\/div>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0;border-bottom:2px solid var(--color-text);padding-bottom:8px\">4 · Life preferences<\/h2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Monthly budget for living costs<\/label>\n            <sc-raw-select class=\"input\" name=\"budget\" sc-camel-default-value=\"{{ savedBudget }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>Under $1,500<\/option><option>$1,500–$2,500<\/option><option>$2,500–$4,000<\/option><option>Over $4,000<\/option>\n            <\/sc-raw-select>\n          <\/div>\n          <div class=\"field\"><label>What are you after?<\/label>\n            <sc-raw-select class=\"input\" name=\"goal\" sc-camel-default-value=\"{{ savedGoal }}\" sc-camel-on-change=\"{{ onField }}\">\n              <option value=\"\">Select…<\/option><option>6–24 months of travel<\/option><option>A long-term base<\/option><option>A path to permanent residency<\/option>\n            <\/sc-raw-select>\n          <\/div>\n        <\/div>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div class=\"field\"><label>Is 0% tax on foreign income a priority?<\/label>\n            <div class=\"seg\">\n              <label class=\"seg-opt\" style=\"white-space:nowrap\"><input type=\"radio\" name=\"tax\" value=\"Yes\" checked=\"{{ taxYes }}\" sc-camel-on-change=\"{{ onField }}\">Yes, important<\/label>\n <section data-screen-label=\"Results\" style=\"max-width:960px;margin:0 auto;padding:48px 24px\">\n    <h6 style=\"color:var(--color-accent)\">Your results<\/h6>\n    <h1 style=\"margin-bottom:8px\">Where you can go<\/h1>\n    <p class=\"text-muted\" style=\"margin-bottom:24px\">Thresholds carry official sources, effective dates and an August 2026 check — verify before applying.<\/p>\n\n    <div style=\"display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap\">\n      <button class=\"btn {{ tMatchesBtn }}\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ setResTab }}\" data-tab=\"matches\">Matches<\/button>\n      <button class=\"btn {{ tCompareBtn }}\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ setResTab }}\" data-tab=\"compare\">Comparison<\/button>\n      <button class=\"btn {{ tDocsBtn }}\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ setResTab }}\" data-tab=\"docs\">Documents<\/button>\n      <button class=\"btn {{ tPlanBtn }}\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ setResTab }}\" data-tab=\"plan\">Action plan<\/button>\n    <\/div>\n\n    <sc-if value=\"{{ tabMatches }}\" hint-placeholder-val=\"{{ true }}\">\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">Your ranking<\/h2>\n    <div style=\"display:flex;flex-direction:column;gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);margin-bottom:40px\">\n      <sc-for list=\"{{ matches }}\" as=\"m\" hint-placeholder-count=\"5\">\n        <div style=\"background:var(--color-bg);padding:20px 24px;display:grid;grid-template-columns:56px 1fr 140px;gap:16px;align-items:center\">\n          <div style=\"font-family:var(--font-heading);font-weight:800;font-size:28px;color:var(--color-accent)\">{{ m.rank }}<\/div>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n              <span style=\"font-family:var(--font-heading);font-weight:800;font-size:17px\">{{ m.country }} — {{ m.name }}<\/span>\n              <span class=\"tag tag-accent\">{{ m.type }}<\/span>\n              <span class=\"tag tag-neutral\">Likely eligible<\/span>\n              <sc-if value=\"{{ m.zeroTax }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"tag tag-outline\" style=\"white-space:nowrap\">0% foreign tax possible<\/span><\/sc-if>\n            <\/div>\n            <div class=\"text-muted\" style=\"font-size:13px\">{{ m.why }}<\/div>\n            <div style=\"font-size:12px;font-weight:600;color:var(--color-accent-700)\">{{ m.detail }}<\/div>\n          <\/div>\n          <div style=\"display:flex;flex-direction:column;gap:4px;align-items:flex-end\">\n            <div class=\"text-muted\" style=\"font-size:10px;text-transform:uppercase;letter-spacing:0.08em\">Lifestyle fit<\/div>\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:20px\">{{ m.score }}<span style=\"font-size:12px;opacity:0.6\">/100<\/span><\/div>\n            <div style=\"width:120px;height:8px;background:var(--color-neutral-200)\"><div style=\"{{ m.barStyle }}\"><\/div><\/div>\n            <div class=\"text-muted\" style=\"font-size:11px\">Docs {{ m.readiness }}% self-reported<\/div>\n            <button class=\"btn btn-ghost\" style=\"white-space:nowrap;font-size:12px;padding:4px 8px\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"visas\">View details<\/button>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <sc-if value=\"{{ noMatches }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card elev-sm\" style=\"padding:24px;margin-bottom:40px\">\n        <div class=\"card-title\">No strong matches yet<\/div>\n        <p class=\"card-body\">At your current income the dedicated visas are out of reach — but Georgia's visa-free year and Mexico's 180-day entry have no income minimum, and Colombia's nomad visa starts around $750/month.<\/p>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ aiOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card elev-sm\" style=\"padding:24px;margin-bottom:40px\">\n        <div class=\"card-kicker\">Why this recommendation<\/div>\n        <sc-if value=\"{{ aiLoading }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14px;margin:0\" class=\"text-muted\">Analyzing your profile…<\/p><\/sc-if>\n        <sc-if value=\"{{ aiText }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:15px;line-height:1.7;margin:0;white-space:pre-wrap\">{{ aiText }}<\/p><\/sc-if>\n        <p class=\"text-muted\" style=\"font-size:11px;margin:12px 0 0\">Rankings are based only on your profile — no destination pays for placement.<\/p>\n      <\/div>\n    <\/sc-if>\n    <\/sc-if>\n\n    <sc-if value=\"{{ hasTop3 }}\" hint-placeholder-val=\"{{ false }}\">\n    <sc-if value=\"{{ tabCompare }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">Your top three, compared<\/h2>\n      <sc-raw-table class=\"table\" style=\"margin-bottom:40px\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:180px\"><\/sc-raw-th>\n          <sc-for list=\"{{ top3 }}\" as=\"t\" hint-placeholder-count=\"3\"><sc-raw-th>{{ t.country }}<div class=\"text-muted\" style=\"font-size:11px;font-weight:400\">{{ t.name }}<\/div><\/sc-raw-th><\/sc-for>\n        <\/sc-raw-tr><\/sc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ compareRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n            <sc-raw-tr><sc-raw-td style=\"font-weight:600;white-space:nowrap\">{{ row.label }}<\/sc-raw-td>\n              <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"3\"><sc-raw-td>{{ x;gap:8px\"><span style=\"color:var(--color-accent);font-weight:800\">→<\/span>Personal tax plan: when you become tax-resident, 183-day math, your 3 destinations' tax burden compared<\/div>\n          <div style=\"display:flex;gap:8px\"><span style=\"color:var(--color-accent);font-weight:800\">→<\/span>Your Schengen calendar: how to chain stays legally through the year<\/div>\n          <div style=\"display:flex;gap:8px\"><span style=\"color:var(--color-accent);font-weight:800\">→<\/span>Full document pack: country checklist, employer letter + client contract templates<\/div>\n          <div style=\"display:flex;gap:8px\"><span style=\"color:var(--color-accent);font-weight:800\">→<\/span>Complete week-by-week action plan with official links and the right forms<\/div>\n        <\/div>\n        <div style=\"display:flex;gap:12px;align-items:center\">\n          <button class=\"btn btn-primary\" style=\"padding:12px 24px;font-size:15px;white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"checkout\">Get your Blueprint — $49<\/button>\n          <span class=\"text-muted\" style=\"font-size:12px\">One-time. Free updates for 12 months.<\/span>\n        <\/div>\n      <\/div>\n      <div style=\"background:var(--color-surface);border-left:2px solid var(--color-divider);padding:24px;display:flex;flex-direction:column;gap:8px\">\n        <div class=\"text-muted\" style=\"font-size:11px;text-transform:uppercase;letter-spacing:0.08em\">Sample page — tax section<\/div>\n        <div style=\"background:var(--color-bg);border:1px solid var(--color-divider);padding:16px;font-size:12px;line-height:1.7;flex:1\">\n          <div style=\"font-family:var(--font-heading);font-weight:800;margin-bottom:6px\">When do you become a tax resident?<\/div>\n          <div>Spain: day 183 of presence in a calendar year …<\/div>\n          <div>Portugal: 183 days OR habitual home …<\/div>\n          <div style=\"color:var(--color-accent-700);font-weight:600;margin-top:6px\">Your p /sc-if>\n          <\/div>\n          <div style=\"font-size:13px;line-height:1.6\">{{ t.tax }}<\/div>\n          <div class=\"text-muted\" style=\"font-size:12px;margin-top:6px\">Complexity: {{ t.taxC }}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <p class=\"text-muted\" style=\"font-size:13px;margin:0 0 40px\">Rule of thumb: 183+ days of presence in a calendar year usually makes you tax-resident. Plan your calendar around that number and confirm with a tax adviser before committing.<\/p>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">3 · Rules that matter for your case<\/h2>\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:40px\">\n      <sc-for list=\"{{ reportRules }}\" as=\"rr\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;gap:10px;font-size:14px;line-height:1.6\"><span style=\"color:var(--color-accent);font-weight:800\">→<\/span><span><strong>{{ rr.k }}:<\/strong> {{ rr.v }}<\/span><\/div>\n      <\/sc-for>\n    <\/div>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">4 · {{ letterTitle }}<\/h2>\n    <div style=\"border:2px solid var(--color-divider);padding:20px 24px;margin-bottom:40px;font-size:13px;line-height:1.8;font-family:monospace;white-space:pre-wrap\">{{ letterText }}<\/div>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">5 · Step-by-step path — {{ partyLabel }}<\/h2>\n    <div style=\"display:flex;flex-direction:column;gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);margin-bottom:40px\"> te-space:nowrap\">{{ b.v }}<\/span>\n        <\/div>\n      <\/sc-for>\n      <div style=\"background:var(--color-text);color:var(--color-bg);padding:14px 20px;display:flex;justify-content:space-between;align-items:baseline\">\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:0.08em\">Estimated total to land<\/span>\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:20px\">{{ budgetTotal }}<\/span>\n      <\/div>\n    <\/div>\n    <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 40px\">Estimates for {{ partyLabel }}; actual consulate fees and rents vary by city and nationality.<\/p>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">7 · Your 12-month calendar<\/h2>\n    <div style=\"display:flex;gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);margin-bottom:8px\">\n      <sc-for list=\"{{ calMonths }}\" as=\"cm\" hint-placeholder-count=\"12\">\n        <div style=\"flex:1;background:{{ cm.bg }};color:{{ cm.fg }};padding:10px 4px;text-align:center;min-width:0\">\n          <div style=\"font-family:var(--font-heading);font-weight:800;font-size:11px\">{{ cm.m }}<\/div>\n          <div style=\"font-size:9px;text-transform:uppercase;letter-spacing:0.04em\">{{ cm.label }}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:40px\">\n      <sc-for list=\"{{ calNotes }}\" as=\"cn\" hint-placeholder-count=\"3\">\n        <div style=\"font-size:13px;display:flex;gap:8px;line-height:1.6\"><span style=\"color:var(--color-accent);font-weight:800\">→<\/span><span>{{ cn }}<\/span><\/div>\n      <\/sc-for>\n    <\/div>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">8 · Rejection risks in your file — and the fix<\/h2>\n    <div style=\"display:flex;flex-direction:column;gap:2px;background:var(--color-divider);border:2px solid var(--color-divider);margin-bottom:40px\">\n      <sc-for list=\"{{ riskRows }}\" as=\"rk\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--color-bg);padding:14px 20px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline\">\n          <span class=\"tag {{ rk.tagClass }}\" style=\"white-space:nowrap\">{{ rk.level }}<\/span>\n          <div style=\"font-size:13px;line-height:1.6\"><strong>{{ rk.risk }}<\/strong> — {{ rk.fix }}<\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">9 · Plan B — if {{ reportDest }} falls through<\/h2>\n    <div class=\"card elev-sm\" style=\"padding:20px 24px;margin-bottom:40px\">\n      <div style=\"font-size:14px;line-height:1.7\">{{ planB }}<\/div>\n    <\/div>\n\n    <h2 style=\"font-size:14px;font-family:var(--font-heading);font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 16px;border-bottom:2px solid var(--color-text);padding-bottom:8px\">10 · First 30 days after landing<\/h2>\n    <div style=\"display:flex;flex-direction:column;gap:5px;margin-bottom:40px\">\n      <sc-for list=\"{{ landingSteps }}\" as=\"ls\" hint-placeholder-count=\"6\">\n        <div style=\"font-size:13px;display:flex;gap:8px;line-height:1.6\"><span style=\"border:1.5px solid var(--color-text);width:12px;height:12px;flex:none;margin-top:3px\"><\/span><span><strong>{{ ls.when }}:<\/strong> {{ ls.what }}<\/span><\/div>\n      <\/sc-for>\n    <\/div>\n\n    <p class=\"text-muted\" style=\"font-size:12px;margin:0 0 24px\"> >→ Document checklist &amp; letter templates<\/span>\n            <span>→ Week-by-week timeline, official links<\/span>\n            <span>→ Free updates for 12 months<\/span>\n          <\/div>\n          <div style=\"background:var(--color-bg);padding:16px;display:flex;justify-content:space-between;font-size:15px;border-top:2px solid var(--color-divider)\"><span style=\"font-weight:800\">Total<\/span><span style=\"font-weight:800;color:var(--color-accent-700)\">$49.00<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ isPaid }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:560px\">\n        <h1 style=\"margin-bottom:8px\">Payment received ✓<\/h1>\n        <p style=\"font-size:16px;line-height:1.7;margin-bottom:24px\">Your Blueprint is being generated from your wizard answers and will land in <strong>{{ paidEmail }}<\/strong> within a few minutes. It's also saved to your dashboard.<\/p>\n        <div style=\"display:flex;gap:12px\">\n          <button class=\"btn btn-primary\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"dash\">Go to my dashboard<\/button>\n          <button class=\"btn btn-ghost\" style=\"white-space:nowrap\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"results\">Back to my results<\/button>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n  <\/section>\n  <\/sc-if>\n\n  <sc-if value=\"{{ isGuide }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Country guide\" style=\"max-width:880px;margin:0 auto;padding:48px 24px\">\n    <button class=\"btn btn-ghost\" style=\"white-space:nowrap;margin-bottom:24px\" sc-camel-on-click=\"{{ goScreen }}\" data-screen=\"visas\">← All destinations<\/button>\n    <h6 style=\"color:var(--color-accent)\">{{ gKicker }}<\/h6>\n    <h1 style=\"font-size:44px;margin-bottom:16px\">{{ gTitle }}<\/h1>\n    <figure class=\"grayscale\" style=\"margin:0 0 24px;height:320px;background:repeating-linear-gradien
